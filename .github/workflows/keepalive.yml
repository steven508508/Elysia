name: 🛡️ E5 保活

on:
  # 一天 3 次，基準時間相隔 8 小時（UTC）。
  # 程式啟動後還會再隨機等 0~50 分鐘（config.yml 的 random_delay_max_minutes），
  # 所以每天實際執行時刻都不一樣，而兩次執行至少相隔 7 小時以上。
  #
  # 下面是 UTC 時間，換算成台北時間（UTC+8）分別是 09:23 / 17:47 / 01:11。
  # 刻意避開整點，因為每天整點是 GitHub 排程最壅塞的時候，容易被延遲。
  schedule:
    - cron: '23 1 * * *'
    - cron: '47 9 * * *'
    - cron: '11 17 * * *'
  workflow_dispatch:

permissions:
  contents: write        # 需要寫入權限才能把執行紀錄提交回 repo

concurrency:
  group: e5keeper-run
  cancel-in-progress: false

jobs:
  keepalive:
    name: 保活執行
    runs-on: ubuntu-latest
    timeout-minutes: 110      # 要涵蓋隨機等待 + 所有帳號跑完
    steps:
      - name: 取出程式碼
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: 安裝 Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: pip

      - name: 安裝相依套件
        run: pip install --quiet -r requirements.txt

      - name: 執行保活
        env:
          E5_ACCOUNTS: ${{ secrets.E5_ACCOUNTS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
        run: python -m e5keeper run --jitter --trigger "$EVENT_NAME"
