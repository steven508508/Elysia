name: 🛡️ E5 保活

on:
  # 這裡是 8 個「候選」時段，不是每個都會執行。
  #
  # 每天實際會跑幾次、跑哪幾班，由 config.yml 的 humanize 決定：
  # 平日隨機挑 2~5 班、週末 1~3 班，組合由「日期 + repo 名稱」推導 ——
  # 所以同一天的每一班都算得出同一份行程，而每天、每個人的行程都不同。
  # 沒被選中的班次會在幾秒內結束，不會空等，也不會呼叫任何 Microsoft API。
  #
  # 被選中的班次還會再隨機等 0~30 分鐘才開始，所以連時刻都不固定。
  #
  # 下面是 UTC，換算台北時間依序是：
  #   08:37  10:13  12:41  14:29  17:07  19:53  22:19  00:31
  # 刻意全部避開整點與半點 —— 那是 GitHub 排程最壅塞、也最像機器的時間。
  schedule:
    - cron: '37 0 * * *'
    - cron: '13 2 * * *'
    - cron: '41 4 * * *'
    - cron: '29 6 * * *'
    - cron: '7 9 * * *'
    - cron: '53 11 * * *'
    - cron: '19 14 * * *'
    - cron: '31 16 * * *'
  workflow_dispatch:

permissions:
  contents: write        # 需要寫入權限才能把執行紀錄提交回 repo

concurrency:
  group: e5keeper-run
  cancel-in-progress: false

jobs:
  keepalive:
    name: 保活執行
    runs-on: ubuntu-latest
    timeout-minutes: 110      # 要涵蓋隨機等待 + 所有帳號跑完
    steps:
      - name: 取出程式碼
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 安裝 Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
          cache: pip

      - name: 安裝相依套件
        run: pip install --quiet -r requirements.txt

      - name: 執行保活
        env:
          E5_ACCOUNTS: ${{ secrets.E5_ACCOUNTS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
        run: python -m e5keeper run --jitter --trigger "$EVENT_NAME"
