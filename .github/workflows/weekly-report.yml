name: 📈 E5 每週統計

on:
  # 每週一 09:30（台北時間），也就是 UTC 週一 01:30
  schedule:
    - cron: '30 1 * * 1'
  workflow_dispatch:
    inputs:
      days:
        description: '統計最近幾天'
        required: false
        default: '7'
        type: string

permissions:
  contents: read

jobs:
  report:
    name: 產生統計報告
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 取出程式碼
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0      # 需要完整歷史才讀得到所有紀錄

      - name: 安裝 Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip

      - name: 安裝相依套件
        run: pip install --quiet -r requirements.txt

      - name: 送出統計報告
        env:
          E5_ACCOUNTS: ${{ secrets.E5_ACCOUNTS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          IN_DAYS: ${{ github.event.inputs.days }}
        run: |
          set -euo pipefail
          DAYS="${IN_DAYS:-7}"
          # 只接受純數字，避免奇怪的輸入
          case "$DAYS" in
            ''|*[!0-9]*) DAYS=7 ;;
          esac
          python -m e5keeper report --days "$DAYS"
